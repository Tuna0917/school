{% extends 'school.html' %}

{% block content %}
<div class="container py-4">
  <div class="alert alert-danger" role="alert">
    <strong>이 화면은 한 번만 표시됩니다.</strong>
    비밀번호는 해시로만 저장되므로 지금 복사해 두지 않으면 다시 볼 수 없습니다.
  </div>

  <table class="table table-sm align-middle">
    <caption class="sr-only">새로 만든 학생 계정과 초기 비밀번호</caption>
    <thead>
      <tr>
        <th scope="col">아이디</th>
        <th scope="col">초기 비밀번호</th>
        <th scope="col"></th>
      </tr>
    </thead>
    <tbody>
      {% for username, password, url in passwords %}
      <tr>
        <td><code>{{ username }}</code></td>
        <td><code>{{ password }}</code></td>
        <td><a href="{{ url }}">상세</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <a class="btn btn-secondary" href="{% url 'student_list' %}">학생 목록으로</a>
</div>
{% endblock %}
